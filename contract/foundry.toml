[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]

[rpc_endpoints]
bohr = "${BOT_RPC_URL}"

[etherscan]
bohr = { key = "${BOHR_EXPLORER_API_KEY}", url = "https://scan.bohr.life/api" }
